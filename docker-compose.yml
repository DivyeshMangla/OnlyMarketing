services:
  mongo:
    image: mongo:latest
    container_name: marketing_portal_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: . # Uses the new root Dockerfile (Monolith)
    container_name: marketing_portal_server
    ports:
      - "5173:5000" # Map 5173 (client port) to 5000 (backend port)
    environment:
      - MONGO_URI=mongodb://mongo:27017/marketing_portal
      - JWT_SECRET=supersecretkey123
      - APOLLO_KEY=${APOLLO_KEY}
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  mongo_data:
